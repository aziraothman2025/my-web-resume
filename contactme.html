<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nur Azira's Resume</title>
    <style>

        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #8db6d3; margin: 0; padding: 0; }
        .header-banner { background-color: #09077c; color: white; text-align: center; padding: 25px 0; }
        .header-banner h1 { margin: 0; font-size: 2rem; }
        .header-banner p { margin: 5px 0 0 0; font-size: 0.9rem; color: #dddddd; }
        
        nav { display: flex; justify-content: center; background-color: #f3f054; flex-wrap: wrap; padding: 5px 0; }
        nav a, .dropdown .dropbtn { color: rgb(255, 255, 255); text-decoration: none; padding: 14px 20px; font-size: 0.95rem; background: none; border: none; cursor: pointer; font-family: inherit; transition: background 0.3s; }
        nav a:hover, .dropdown:hover .dropbtn { background-color: #041568; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #333333; min-width: 160px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { color: white !important; padding: 12px 16px; text-decoration: none; display: block; text-align: left; }
        .dropdown-content a:hover { background-color: #84c4ff; color: white !important; }
        .dropdown:hover .dropdown-content { display: block; }

        .page-border { border: 20px solid #b3d1e6; border-radius: 12px; }

        .main-container { max-width: 900px; margin: 40px auto; background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .page-title { color: #09077c; font-size: 2rem; margin-top: 0; margin-bottom: 25px; border-bottom: 2px solid #f3f054; padding-bottom: 10px; }


        .contact-wrapper { display: flex; gap: 40px; align-items: flex-start; }
        .contact-image-area { flex: 1; max-width: 250px; }
        .contact-profile-img { width: 100%; height: auto; border-radius: 8px; border: 4px solid #8db6d3; box-shadow: 0 4px 10px rgba(0,0,0,0.1); object-fit: cover; }       
        .contact-form-area { flex: 1.2;}       
        .contact-info { margin-bottom: 25px; line-height: 1.6; color: #444;}
        .contact-info p { margin: 8px 0; }
        .contact-info p strong { color: #003366; }
       
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333;}
        .form-group input,.form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
       
        .btn-submit { background-color: #09077c; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem;font-weight: bold; width: 100%; }
        .btn-submit:hover { background-color: #002244; }

        .btn-container { margin-top: 30px; display: flex; justify-content: flex-start; }
        .btn-back { display: inline-block; background-color: #09077c; color: #ffffff; text-decoration: none; padding: 12px 24px; font-size: 0.9rem; font-weight: bold; border-radius: 5px; }
        .btn-back:hover { background-color: #333333; }

        
    </style>
</head>

            <div class="contact-wrapper">
