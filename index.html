<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;  }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fefeef; 
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center; }
       
        .cover-container {
            max-width: 600px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.1); }
        
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #09077c;
            margin-bottom: 20px; }
      
        h1 {
            font-size: 2.2rem;
            color: #09077c;
            margin-bottom: 10px;}
       
            p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;}
       
            .enter-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #f3f054; /* Matches your navigation bar color */
            color: #333;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
       
            .enter-btn:hover {
            background-color: #09077c;
            color: #fff;
            transform: translateY(-2px);}
    
    </style>
</head>
<body>

    <div class="cover-container">
        <img src="azira2.jpeg" alt="Nur Azira Othman" class="profile-img">
        
        <h1>Welcome!</h1>
        <p>Hello, I'm Nur Azira Othman. Welcome to my professional resume website. Click the button below to explore my profile.</p>
        <p>Enjoy your visit! (❁´◡`❁)</p>

        <a href="home.html" class="enter-btn">Enter Website</a>
    </div>

</body>
</html>
