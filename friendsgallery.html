<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Friends Album - Gallery</title>
    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; }
        .page-border { border: 20px solid #b3d1e6; border-radius: 12px; margin: 20px auto; max-width: 950px; padding: 40px; }
        .page-title { color: #003366; font-size: 2rem; border-bottom: 2px solid #f3f054; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .grid img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        .btn-back { display: inline-block; background-color: #003366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; margin-top: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="page-border">
        <h2 class="page-title">👥 Friends Album</h2>
        <p class="intro-text">My cherished moments with friends:</p>
        
        <div class="grid">
            <img src="friendsalbum1.jpeg" alt="Friend Photo 1">
            <img src="friendsalbum2.jpeg" alt="Friend Photo 2">
            <img src="friendsalbum3.jpeg" alt="Friend Photo 3">
            <img src="friendsalbum4.jpeg" alt="Friend Photo 4">
            <img src="friendsalbum5.jpeg" alt="Friend Photo 5">
            <img src="friendsalbum6.jpeg" alt="Friend Photo 6">
        </div>
        <a href="photogallery.html" class="btn-back">Back to Albums</a>
    </div>
</body>
</html>
